<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabijoniškių Baseinas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
    <h1>FABIJONIŠKIŲ BASEINAS</h1>
    <div id="clock"></div>
</div>

<div class="section">
    <h2>PRAĖJĘS</h2>
    <div id="currentTimeSlot" class="timeslot"></div>
    <div id="currentLanes" class="lanes"></div>
</div>

<div class="section">
    <h2>DABAR</h2>
    <div id="nextTimeSlot" class="timeslot"></div>
    <div id="nextLanes" class="lanes"></div>
</div>

<div class="section">
    <h2>KITAS</h2>
    <div id="futureTimeSlot" class="timeslot"></div>
    <div id="futureLanes" class="lanes"></div>
</div>

<div class="footer">
    Paskutinis atnaujinimas:
    <span id="updated"></span>
</div>

<script src="app.js"></script>

</body>
</html>
