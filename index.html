<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fabijoniškių baseinas</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="header-title">
        FABIJONIŠKIŲ BASEINAS
    </div>

    <div id="clock" class="clock">
        --
    </div>

</header>

<main>

    <section class="time-block">

        <div class="block-header previous-header">
            PRAĖJĘS
        </div>

        <div
            id="previousTimeSlot"
            class="time-slot"
        >
            -
        </div>

        <div id="previousLanes"></div>

    </section>

    <section class="time-block current-block">

        <div class="block-header current-header">
            DABAR
        </div>

        <div
            id="currentTimeSlot"
            class="time-slot"
        >
            -
        </div>

        <div id="currentLanes"></div>

    </section>

    <section class="time-block">

        <div class="block-header next-header">
            KITAS
        </div>

        <div
            id="nextTimeSlot"
            class="time-slot"
        >
            -
        </div>

        <div id="nextLanes"></div>

    </section>

</main>

<footer>

    <div class="legend">

        <div class="legend-item">
            <span class="legend-box clients"></span>
            Laisvi takeliai
        </div>

        <div class="legend-item">
            <span class="legend-box club"></span>
            Klubai
        </div>

        <div class="legend-item">
            <span class="legend-box group"></span>
            Grupės
        </div>

        <div class="legend-item">
            <span class="legend-box coach"></span>
            Treneriai
        </div>

    </div>

    <div class="updated-line">

        Duomenys atnaujinti:

        <span id="updated">
            -
        </span>

    </div>

</footer>

<script src="app.js"></script>

</body>
</html>
