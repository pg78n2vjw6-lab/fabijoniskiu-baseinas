<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fabijoniškių Baseinas</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<header>

    <h1>FABIJONIŠKIŲ BASEINAS</h1>

    <div id="clock"></div>

    <div class="legend">

        <div class="legend-item">
            <span class="legend-box clients"></span>
            LAISVI TAKELIAI
        </div>

        <div class="legend-item">
            <span class="legend-box busy"></span>
            UŽIMTI TAKELIAI
        </div>

    </div>

</header>

<div class="container">

    <!-- PRAĖJĘS LAIKAS -->

    <section>

        <div class="section-title previous">
            PRAĖJĘS LAIKAS
        </div>

        <div
            id="previousTimeSlot"
            class="slotTime">
            -
        </div>

        <div class="table-header">
            <span>TAKELIS</span>
            <span>UŽIMTUMAS</span>
        </div>

        <div id="previousLanes"></div>

    </section>

    <!-- DABAR -->

    <section class="current-block">

        <div class="section-title current">
            DABAR
        </div>

        <div
            id="currentTimeSlot"
            class="slotTime">
            -
        </div>

        <div class="table-header">
            <span>TAKELIS</span>
            <span>UŽIMTUMAS</span>
        </div>

        <div id="currentLanes"></div>

    </section>

    <!-- KITAS LAIKAS -->

    <section>

        <div class="section-title next">
            KITAS LAIKAS
        </div>

        <div
            id="nextTimeSlot"
            class="slotTime">
            -
        </div>

        <div class="table-header">
            <span>TAKELIS</span>
            <span>UŽIMTUMAS</span>
        </div>

        <div id="nextLanes"></div>

    </section>

</div>

<footer>

    <div class="footer-update">
        Duomenys atnaujinti:
        <span id="updated">-</span>
    </div>

    <div class="footer-website">
        Pilnas tvarkaraštis:
        www.fabijoniskiubaseinas.lt
    </div>

</footer>

<script src="app.js"></script>

</body>
</html>
